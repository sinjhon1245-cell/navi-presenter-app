# 자동 시험: PR을 열거나 고칠 때, main에 올라갈 때 Playwright 시험(6가지 화면 크기 + Firebase 묶음)을 GitHub에서 돌려요.
# 시험은 GitHub 안에서 띄운 서버(scripts/serve.js)로 하므로 Vercel 보안 검문과 상관없어요.
# Firebase 묶음(보안 규칙 · 휴대폰 ↔ 교사 PC 실시간 · 저장 비교)은 GitHub 안에서 띄운 Firebase 에뮬레이터(자바 21)의
# 가짜 프로젝트 demo-navi로 돌려요. 실제 Firebase 프로젝트 · 실제 구글 계정에는 닿지 않아요.
# Vercel 배포와는 따로 돌아요. 이 시험이 실패해도 Vercel 배포를 막지 않아요(막으려면 저장소 설정의 main 보호 규칙을 따로 켜야 해요).
# 비밀 값을 쓰지 않아요.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 새로 올리면 앞의 실행은 멈추고 새 것만 돌려요
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    # 작업 전체(준비 약 2분 + 시험)의 시간 제한이에요. 시험 하나하나의 시간 기준과는 따로예요.
    # 시험 단계: main(ac2a6e6) 11분, 학생 화면 안정성(PR #9) 16분, 장면 진행(PR #8)까지 합치면 약 19분이라 20분으로는 끝나기 전에 멈춰요(2026-11-10)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 한글 글꼴 (인터넷 글꼴을 못 받을 때 대신)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - name: 자바 21 (Firebase 에뮬레이터용, Microsoft OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
      - name: Firebase 에뮬레이터 파일 보관 (다음 실행에서 다시 받지 않게)
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - name: 시험 (Firebase 에뮬레이터 안에서 전부)
        run: npm run test:all
      - name: 결과 요약 (통과 · 실패 · 건너뜀 · 미실행)
        if: always()
        run: node scripts/ci-summary.js
      - name: 실패하면 결과 파일 올리기 (7일 보관)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            playwright-report
          retention-days: 7
