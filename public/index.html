<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수업 내비 프레젠터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B3FC4'/%3E%3Cpath d='M10 22V10l12 12V10' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Pretendard comes in once the page has loaded: a stylesheet in the head would hold every script below it, so a slow or blocked font server
     (a school network, a CDN hiccup) would stop the app from starting at all. System fonts stand in until it arrives (data-state: loaded | error). -->
<script>
window.addEventListener("load", function () {
  var l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css";
  l.onload = function () { l.setAttribute("data-state", "loaded"); };
  l.onerror = function () { l.setAttribute("data-state", "error"); };
  document.head.appendChild(l);
});
</script>
<style>
/* 수업 내비 0.7 design system.
   Prepare on a calm, light desk (home · lesson prep · records); teach from a dark presenting surface (teacher screen · phone remote).
   Tokens come in three layers: primitives → semantic roles (light / dark) → components. Components only read semantic roles,
   so a palette (PALETTES in the script) or a theme changes colour without touching a component.
   The traffic light keeps one hue per meaning in every theme: red = explain again, yellow = check more, green = understood,
   always shown with an icon and words. Status (late, disconnected, not saved) is a separate red-orange and never a light.
   The student screen (slides and materials) keeps its own fixed --slide-* colours in every theme. */
:root {
  /* primitives */
  --white: #FFFFFF; --g-25: #FAFAFB; --g-50: #F7F7F8; --g-100: #F0F0F2; --g-150: #E8E8EC; --g-200: #D9D9DF; --g-300: #C3C3CB;
  --g-500: #686875; --g-600: #54545E; --g-900: #17171C;
  --d-950: #0F1115; --d-900: #14171C; --d-850: #171A20; --d-800: #1F232B; --d-750: #262B34; --d-700: #2E3440; --d-line: #2A2F38; --d-line-2: #3A404B;
  /* palette: set from PALETTES by applyTheme(); these are the navy defaults */
  --pal-accent: #5B3FC4; --pal-fill: #5B3FC4; --pal-on: #FFFFFF; --pal-soft: #F1EEFC;
  --pal-d-accent: #B9A7F5; --pal-d-fill: #8F7BFF; --pal-d-on: #12102A; --pal-d-soft: #2A2347;
  /* the traffic light: fixed hues, same meaning everywhere */
  --sig-red: #CC3D3D; --sig-yellow: #C98A00; --sig-green: #1F7F4A;
  --sig-red-on: #FFFFFF; --sig-yellow-on: #1F1600; --sig-green-on: #FFFFFF;
  /* the student screen: never themed */
  --slide-bg: #FFFFFF; --slide-ink: #1F2A44; --slide-muted: #5B6575; --slide-accent: #5B3FC4; --slide-line: #E1E4EA; --slide-soft: #F4F5F8;
  /* type, space, shape */
  --f-body: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-mono: var(--f-body);
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 15px; --fs-lg: 17px; --fs-xl: 21px; --fs-2xl: 26px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-pill: 999px;
  --side-w: 232px; --bar-h: 60px;

  /* semantic roles · light (default) */
  --bg: var(--white); --bg-sub: var(--g-50); --bg-sunk: var(--g-100); --surface: var(--white); --hover: #F3F3F5;
  --line: var(--g-150); --line-2: var(--g-200);
  --tx: var(--g-900); --tx-2: var(--g-600); --tx-3: var(--g-500);
  --strong: var(--g-900); --strong-on: var(--white); --strong-hover: #2C2C34;
  --ac: var(--pal-accent); --ac-fill: var(--pal-fill); --ac-on: var(--pal-on); --ac-soft: var(--pal-soft);
  --red-bg: #FCEEEE; --red-tx: #AE2E2E; --yel-bg: #FFF5DB; --yel-tx: #855A00; --grn-bg: #E7F5ED; --grn-tx: #1C7143;
  --warn: #B23F0E; --warn-dot: #E0561B; --warn-bg: #FFF1EA;
  --pop: 0 12px 32px rgba(17, 17, 28, .14), 0 0 0 1px rgba(17, 17, 28, .06);
  --lift: 0 1px 2px rgba(17, 17, 28, .06), 0 0 0 1px rgba(17, 17, 28, .05);
  color-scheme: light;
}
/* semantic roles · dark: the presenting surface, a dark theme chosen for the whole app, or a dark preview inside a light page */
:root[data-tone="dark"], :root[data-navi-theme="dark"], .tone-dark {
  --bg: var(--d-950); --bg-sub: var(--d-900); --bg-sunk: var(--d-800); --surface: var(--d-850); --hover: var(--d-750);
  --line: var(--d-line); --line-2: var(--d-line-2);
  --tx: #F4F5F7; --tx-2: #A9AFBB; --tx-3: #858C99;
  --strong: #F4F5F7; --strong-on: #12141A; --strong-hover: #FFFFFF;
  --ac: var(--pal-d-accent); --ac-fill: var(--pal-d-fill); --ac-on: var(--pal-d-on); --ac-soft: var(--pal-d-soft);
  --red-bg: rgba(204, 61, 61, .18); --red-tx: #F28B8B; --yel-bg: rgba(201, 138, 0, .2); --yel-tx: #F2C14E; --grn-bg: rgba(31, 127, 74, .26); --grn-tx: #6FD39A;
  --warn: #FF9A6B; --warn-dot: #FF8A55; --warn-bg: rgba(224, 86, 27, .16);
  --pop: 0 20px 50px rgba(0, 0, 0, .5), 0 0 0 1px var(--d-line);
  --lift: 0 0 0 1px var(--d-line);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-navi-theme="auto"]:not([data-theme="light"]) {
    --bg: var(--d-950); --bg-sub: var(--d-900); --bg-sunk: var(--d-800); --surface: var(--d-850); --hover: var(--d-750);
    --line: var(--d-line); --line-2: var(--d-line-2); --tx: #F4F5F7; --tx-2: #A9AFBB; --tx-3: #858C99;
    --strong: #F4F5F7; --strong-on: #12141A; --strong-hover: #FFFFFF;
    --ac: var(--pal-d-accent); --ac-fill: var(--pal-d-fill); --ac-on: var(--pal-d-on); --ac-soft: var(--pal-d-soft);
    --red-bg: rgba(204, 61, 61, .18); --red-tx: #F28B8B; --yel-bg: rgba(201, 138, 0, .2); --yel-tx: #F2C14E; --grn-bg: rgba(31, 127, 74, .26); --grn-tx: #6FD39A;
    --warn: #FF9A6B; --warn-dot: #FF8A55; --warn-bg: rgba(224, 86, 27, .16); --pop: 0 20px 50px rgba(0, 0, 0, .5), 0 0 0 1px var(--d-line); --lift: 0 0 0 1px var(--d-line);
    color-scheme: dark;
  }
}
/* a light presenting surface for teachers who turn the dark one off */
:root[data-tone="light"] { color-scheme: light; }

/* ---------- base ---------- */
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--tx); font-family: var(--f-body); font-size: var(--fs-base); line-height: 1.55; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; letter-spacing: -.005em; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ac-fill); outline-offset: 2px; }
a { color: var(--ac); }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h2 { font-size: var(--fs-lg); }
p { margin: 0; }
.ic { display: block; flex-shrink: 0; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--tx-2); }
.small-text { font-size: var(--fs-sm); }
.row { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1320px; margin: 0 auto; padding: var(--s-5) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: var(--s-4); box-sizing: border-box; }
.label { font-size: var(--fs-xs); font-weight: 600; color: var(--tx-2); }
.sub-l { font-size: var(--fs-sm); font-weight: 600; color: var(--tx-2); }
.hint { font-weight: 400; color: var(--tx-3); }

/* buttons: one primary per area; the rest are secondary (outlined) or quiet (no frame) */
.btn { min-height: 44px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: var(--fs-md); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--tx); white-space: nowrap; box-sizing: border-box; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--strong); color: var(--strong-on); border-color: var(--strong); }
.btn.primary:hover { background: var(--strong-hover); }
.btn.warm { background: var(--ac-fill); color: var(--ac-on); border-color: var(--ac-fill); }
.btn.warm:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--tx-2); }
.btn.ghost:hover { background: var(--hover); color: var(--tx); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: var(--fs-sm); font-weight: 600; }
.btn.big { min-height: 56px; padding: 0 22px; font-size: var(--fs-base); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn[disabled]:hover { background: var(--surface); }
.btn.warm[disabled]:hover { background: var(--ac-fill); filter: none; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; border-radius: var(--r-md); background: none; color: var(--tx-2); flex-shrink: 0; padding: 0; }
.icon-btn:hover { background: var(--hover); color: var(--tx); }
.kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; box-shadow: inset 0 0 0 1px currentColor; font-size: 11px; font-weight: 700; line-height: 1; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); font-weight: 600; color: var(--tx-2); min-width: 0; }
.field input, .field select, .inline-input, textarea, .add-form input, .add-form select, .qform input, .copy-row input, .name-in { min-height: 40px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--surface); padding: 0 10px; font-weight: 400; font-size: var(--fs-md); color: var(--tx); min-width: 0; box-sizing: border-box; }
.field input:hover, .field select:hover, textarea:hover { border-color: var(--g-300); }
.field input[type="file"] { padding: 6px 8px; }
textarea { padding: 10px 12px; min-height: 76px; resize: vertical; line-height: 1.6; width: 100%; }
.check { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: var(--fs-md); }
.check input { width: 18px; height: 18px; accent-color: var(--ac-fill); }
/* sign-in: keep the login in this browser (ticked by default) · the display name asked once */
.keep-login { min-height: 32px; font-size: var(--fs-sm); }
.keep-note { margin-top: -4px; }
.name-col { gap: 6px; width: 100%; font-size: var(--fs-md); }
.name-row { flex-wrap: wrap; gap: 8px; width: 100%; }
.name-in { flex: 1 1 180px; max-width: 320px; }
.seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; background: var(--bg-sunk); border-radius: var(--r-md); padding: 3px; }
.seg3 button { min-height: 34px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--tx-2); font-size: var(--fs-sm); font-weight: 600; }
.seg3 button.on { background: var(--surface); color: var(--tx); box-shadow: var(--lift); }

/* chips, tags */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: var(--fs-xs); background: var(--bg-sunk); color: var(--tx-2); white-space: nowrap; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: none; box-shadow: inset 0 0 0 1.5px var(--tx-3); flex-shrink: 0; }
.dot.on { background: var(--tx); box-shadow: none; }
/* a status, not a traffic light: the connection is lost or not made yet */
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { color: var(--tx); }
.chip.live { color: var(--tx); background: var(--ac-soft); }
.chip.live .dot { background: var(--ac-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac-fill) 28%, transparent); }
.chip.warn .dot { background: var(--warn-dot); box-shadow: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cc { font-size: var(--fs-xs); min-height: 24px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: var(--r-pill); background: var(--ac-soft); color: var(--ac); font-weight: 600; white-space: nowrap; }
.chips.big .cc { font-size: var(--fs-md); min-height: 30px; padding: 0 12px; }
.st-tag { font-size: var(--fs-xs); font-weight: 600; color: var(--tx-2); background: var(--bg-sunk); min-height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: var(--r-pill); white-space: nowrap; }
.ex-badge { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: var(--r-sm); background: var(--bg-sunk); color: var(--tx-2); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.src { font-size: 11px; font-weight: 600; min-height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: var(--r-sm); white-space: nowrap; background: var(--bg-sunk); color: var(--tx-2); }
.src.mine { background: var(--strong); color: var(--strong-on); }
.kind-tag { font-size: var(--fs-xs); font-weight: 700; color: var(--k-ink); white-space: nowrap; }
.rec-tag, .up-tag { font-size: 11px; font-weight: 700; color: var(--ac); white-space: nowrap; }
.up-tag { color: var(--k-ink); }
.past, .tv-what { font-size: var(--fs-xs); color: var(--tx-3); }
.badge { min-width: 20px; height: 20px; border-radius: var(--r-pill); background: var(--bg-sunk); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box; color: var(--tx-2); }
.badge.rec { background: var(--ac-soft); color: var(--ac); }
.badge.empty { visibility: hidden; }

/* notes, warnings, confirm lines (never browser dialogs) */
.note { font-size: var(--fs-sm); color: var(--tx-2); background: var(--bg-sub); border-radius: var(--r-md); padding: 10px 12px; }
.note b { color: var(--tx); }
.old-note { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.watch-head { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.watch-list { list-style: none; margin: 0; padding: 0; }
.watch-list li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-md); color: var(--tx-2); }
.watch-list li.now { color: var(--tx); font-weight: 700; }
.watch-list li .t { flex: 1; min-width: 0; }
.warn-note { font-size: var(--fs-sm); color: var(--warn); background: var(--warn-bg); border-radius: var(--r-md); padding: 10px 12px; }
.ok-text { font-size: var(--fs-sm); color: var(--tx-2); }
.confirm { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--warn); font-size: var(--fs-md); }
.confirm.col { flex-direction: column; align-items: flex-start; gap: 6px; }
.confirm b { color: var(--warn); }
.confirm ul { margin: 0; padding-left: 18px; }
.confirm .btn { color: var(--tx); }
/* 2026-11-15: a confirmation that answers a press opens in the middle of the screen over a dimmed page (in the page, never the browser's
   confirm()). Esc · a press outside = the dialog's cancel; the lesson's keys wait while it is open */
.pop-layer { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
.pop-back { position: absolute; inset: 0; background: rgba(12, 16, 28, .5); }
.pop-layer .pop { position: relative; z-index: 1; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box;
  display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px 10px; padding: 22px 24px 20px; margin: 0;
  background: var(--bg); color: var(--tx); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 64px rgba(0, 0, 0, .3);
  font-size: var(--fs-md); line-height: 1.6; text-align: left; }
.pop-layer .pop > :not(button):not(.btn) { flex: 1 1 100%; min-width: 0; }
.pop-layer .pop > b:first-child, .pop-layer .pop > span:first-child { font-size: var(--fs-lg); font-weight: 700; color: var(--tx); line-height: 1.45; }
.pop-layer .pop b { color: var(--tx); }
.pop-layer .pop span, .pop-layer .pop li, .pop-layer .pop label, .pop-layer .pop small { color: var(--tx-2); }
.pop-layer .pop > span:first-child, .pop-layer .pop label { color: var(--tx); }
.pop-layer .pop button, .pop-layer .pop .btn { min-height: 44px; padding: 0 18px; font-size: var(--fs-md); }
.pop-layer .pop > button:first-of-type, .pop-layer .pop > .btn:first-of-type { margin-left: auto; }
.pop-layer .pop .row { justify-content: flex-end; flex: 1 1 100%; }
.pop-layer .pop .warm, .pop-layer .pop .danger { background: var(--warn); color: #fff; border-color: var(--warn); }
@media (max-width: 760px) {
  .pop-layer { align-items: flex-end; padding: 0; }
  .pop-layer .pop { width: 100%; border-radius: 18px 18px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; }
  .pop-layer .pop > button, .pop-layer .pop > .btn, .pop-layer .pop .row > .btn { flex: 1 1 0; margin-left: 0; min-height: 52px; }
}
.confirm .btn.warm { color: var(--ac-on); }
.confirm .btn.primary { color: var(--strong-on); }
.progress { height: 6px; border-radius: 3px; background: var(--bg-sunk); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ac-fill); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-4) var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; box-sizing: border-box; }

/* ---------- the traffic light ---------- */
.s-red { --sig: var(--sig-red); --sig-on: var(--sig-red-on); --sig-bg: var(--red-bg); --sig-ink: var(--red-tx); }
.s-yellow { --sig: var(--sig-yellow); --sig-on: var(--sig-yellow-on); --sig-bg: var(--yel-bg); --sig-ink: var(--yel-tx); }
.s-green { --sig: var(--sig-green); --sig-on: var(--sig-green-on); --sig-bg: var(--grn-bg); --sig-ink: var(--grn-tx); }
.k-red { --k-bg: var(--red-bg); --k-line: var(--sig-red); --k-ink: var(--red-tx); }
.k-yellow { --k-bg: var(--yel-bg); --k-line: var(--sig-yellow); --k-ink: var(--yel-tx); }
.k-green { --k-bg: var(--grn-bg); --k-line: var(--sig-green); --k-ink: var(--grn-tx); }
.sigs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
.sig { min-height: 52px; border-radius: var(--r-lg); border: 0; background: transparent; color: var(--sig-ink); font-weight: 700; font-size: var(--fs-md); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 4px 10px; line-height: 1.25; box-sizing: border-box; position: relative; box-shadow: inset 0 0 0 1px var(--line-2); }
.sig i { font-style: normal; display: inline-grid; place-items: center; color: var(--sig); }
.sig:hover { box-shadow: inset 0 0 0 1.5px var(--sig); background: var(--sig-bg); }
.sig.on i { color: inherit; }
.sig.on { background: var(--sig); color: var(--sig-on); box-shadow: none; }
.sig .kbd { position: absolute; top: 6px; right: 8px; }
.sd { display: inline-flex; gap: 3px; align-items: center; font-size: var(--fs-xs); font-weight: 700; color: var(--sig-ink); }
.sd i, .rg-h i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--sig-on); background: var(--sig); flex-shrink: 0; }
.sigdots { display: inline-flex; gap: 8px; align-items: center; }
.sigbar { display: inline-flex; gap: 2px; align-items: center; }
.sigbar i { width: 6px; height: 14px; border-radius: 2px; background: var(--line-2); }
.sigbar i.red { background: var(--sig-red); } .sigbar i.yellow { background: var(--sig-yellow); } .sigbar i.green { background: var(--sig-green); }

/* ---------- the student screen (slides): fixed colours, every theme ---------- */
.slide { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--slide-bg); color: var(--slide-ink); border-radius: var(--r-md); overflow: hidden; box-shadow: 0 0 0 1px rgba(17, 17, 28, .1); box-sizing: border-box; font-family: var(--f-body); letter-spacing: 0; }
.slide.img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; max-width: none; }
.s-in { position: absolute; inset: 0; padding: 6cqw 7cqw 8cqw; display: flex; flex-direction: column; gap: 2.2cqw; }
.s-eye { font-size: 1.9cqw; font-weight: 700; color: var(--slide-accent); letter-spacing: .03em; }
.s-title { font-size: 4.6cqw; font-weight: 700; line-height: 1.3; text-wrap: balance; letter-spacing: -.01em; }
.s-cover .s-title { font-size: 6cqw; margin-top: 6cqw; }
.s-sub { font-size: 2.5cqw; color: var(--slide-muted); }
.s-foot { position: absolute; left: 7cqw; right: 7cqw; bottom: 3cqw; display: flex; justify-content: space-between; font-size: 1.5cqw; color: var(--slide-muted); }
.s-table { display: grid; gap: .8cqw; font-size: 2.4cqw; }
.s-row { display: grid; grid-template-columns: 16cqw 18cqw minmax(0, 1fr); gap: 2cqw; padding: 1.4cqw 2cqw; background: var(--slide-soft); border-radius: 1cqw; }
.s-row.two { grid-template-columns: minmax(0, 1fr) 24cqw; }
.s-choices { display: flex; gap: 2cqw; font-size: 3cqw; font-weight: 600; margin-top: 2cqw; }
.s-choices span { flex: 1; padding: 2.4cqw; border: .3cqw solid var(--slide-line); border-radius: 1.2cqw; text-align: center; }
.s-list { margin: 0; padding-left: 3.4cqw; display: flex; flex-direction: column; gap: 1.6cqw; font-size: 2.7cqw; }
.s-defs { display: flex; flex-direction: column; gap: 1.6cqw; font-size: 2.7cqw; }
.s-defs div { display: grid; grid-template-columns: 14cqw minmax(0, 1fr); gap: 2cqw; padding: 2cqw; background: var(--slide-soft); border-radius: 1.2cqw; }
.slide.img { aspect-ratio: var(--ar, 16 / 9); }
.slide.long .s-title { font-size: 3.6cqw; }
.slide.dense .s-list, .slide.dense .s-defs, .slide.dense .s-table { font-size: 2.1cqw; gap: 1cqw; }
.slide.media { background: #0E1116; display: flex; align-items: center; justify-content: center; }
.slide.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.slide.media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #FFFFFF; }
.media-card { color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 1.4cqw; text-align: center; padding: 4cqw; }
.media-card small { font-size: 2.4cqw; color: var(--ov, #F0B54A); font-weight: 700; }
.media-card b { font-size: 4.4cqw; line-height: 1.3; }
/* a kept file that is still opening, or that this browser (or this device) does not have: said on the slide, not a broken picture */
.slide.img.miss { background: var(--slide-soft); display: flex; align-items: center; justify-content: center; }
.s-miss { display: flex; flex-direction: column; align-items: center; gap: 1.4cqw; padding: 4cqw; text-align: center; }
.s-miss b { font-size: 3.6cqw; line-height: 1.3; }
.s-miss span { font-size: 2.2cqw; color: var(--slide-muted); }
.media-card.file-miss small { color: #FFFFFF; opacity: .8; }
.overlay { position: absolute; left: 4cqw; right: 4cqw; bottom: 4cqw; background: #17202D; color: #FFFFFF; border-radius: 1.4cqw; padding: 2cqw 2.6cqw; display: flex; align-items: center; justify-content: space-between; gap: 2cqw; border-left: 1.2cqw solid var(--ov, #F0B54A); }
.overlay div { display: flex; flex-direction: column; gap: .6cqw; min-width: 0; }
.overlay small { font-size: 1.6cqw; color: var(--ov, #F0B54A); font-weight: 700; }
.overlay b { font-size: 2.8cqw; }
.overlay a { flex-shrink: 0; background: var(--ov, #F0B54A); color: #17202D; font-weight: 700; font-size: 2.2cqw; padding: 1.4cqw 2.4cqw; border-radius: 1cqw; text-decoration: none; }
.tool-timer { position: absolute; top: 3cqw; right: 3cqw; background: #17202D; color: #FFFFFF; border-radius: 1.4cqw; padding: 1cqw 2.2cqw; font-size: 4.4cqw; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.tool-timer.end { background: #B4441B; }
.tool-pick { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(14, 17, 22, .55); }
.tool-pick div { background: #FFFFFF; color: #17202D; border-radius: 2cqw; padding: 3cqw 7cqw; text-align: center; }
.tool-pick b { display: block; font-size: 13cqw; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tool-pick span { font-size: 2.2cqw; color: #5B6575; }
.slide.pic { background: #FFFFFF; }
.slide.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.card-bar { position: absolute; left: 0; right: 0; top: 0; height: 1.2cqw; background: var(--ov, #F0B54A); }

/* the TV window: only the slide; its bar fades out when the mouse rests */
.stage { position: fixed; inset: 0; background: #0E1116; container-type: size; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.stage .slide { width: min(100cqw, 100cqh * 16 / 9); border-radius: 0; box-shadow: none; }
.stage .slide.img { width: min(100cqw, calc(100cqh * var(--ar, 1.7778))); }
.stage .slide.media { width: 100cqw; height: 100cqh; aspect-ratio: auto; }
.stage-msg { color: #DDE3EC; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.stage-msg p { margin: 0; max-width: 520px; text-align: center; line-height: 1.6; }
.stage-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: var(--r-lg); background: rgba(18, 22, 30, .9); opacity: 0; transition: opacity .25s; cursor: default; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; }
.stage-bar .btn { background: transparent; color: #FFFFFF; border-color: rgba(255, 255, 255, .24); }
.stage-bar .btn:hover { background: rgba(255, 255, 255, .1); }
.stage-bar .chip { background: rgba(255, 255, 255, .08); color: #DDE3EC; }
.stage-bar .chip .dot { box-shadow: inset 0 0 0 1.5px #DDE3EC; }
.stage-bar .chip .dot.on { background: #FFFFFF; }
html.awake .stage-bar { opacity: 1; }
/* one-screen class: the confirm line sits on top of the bar, and the bar stays while it asks */
.stage-bar.asking { opacity: 1; }
.stage-ask { flex-basis: 100%; }
.stage-ask .confirm { justify-content: center; }
.stage-bar .confirm .btn.warm { background: var(--ac-fill); border-color: var(--ac-fill); color: var(--ac-on); }
html:not(.awake) .stage { cursor: none; }
/* the student window while the teacher screen reloads (2026-11-19, docs/STAGE-KEEP.md): the last picture stays, with this small note
   at the top (the stage bar sits at the bottom). It shows after a moment, so a reload that is picked up at once does not flicker */
.stage-wait { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 30; padding: 6px 14px; border-radius: 999px; background: rgba(18, 22, 30, .82); color: #DDE3EC; font-size: 15px; pointer-events: none; animation: stage-wait-in .3s ease 1.2s both; }
@keyframes stage-wait-in { from { opacity: 0; } to { opacity: 1; } }
.run-offer .run-tv { color: var(--tx-2); font-size: var(--fs-sm); }
.blankout { position: fixed; inset: 0; z-index: 20; cursor: none; }
.blankout.black { background: #000000; }
.blankout.white { background: #FFFFFF; }

/* ---------- prepare: a dim sidebar, one header, the work in front ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.shell.side-off { grid-template-columns: 64px minmax(0, 1fr); }
.side { position: sticky; top: 0; height: 100vh; background: var(--bg-sub); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; box-sizing: border-box; min-width: 0; z-index: 8; }
.brand-row { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 4px 0 6px; margin-bottom: 10px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ac-fill); color: var(--ac-on); display: grid; place-items: center; flex-shrink: 0; }
.brand-row b { font-size: 15px; font-weight: 700; flex: 1; white-space: nowrap; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border: 0; border-radius: var(--r-md); background: none; color: var(--tx-2); font-weight: 500; font-size: var(--fs-md); text-align: left; width: 100%; box-sizing: border-box; }
.nav-item:hover { background: var(--hover); color: var(--tx); }
.nav-item[aria-selected="true"] { background: var(--bg-sunk); color: var(--tx); font-weight: 600; }
/* 2026-11-15: each menu item a box you can see, the one you are on filled with the accent; the name at the top goes home */
.side-nav { gap: 6px; }
.nav-item { border: 1px solid var(--line); background: var(--bg); color: var(--tx); font-weight: 600; min-height: 42px; }
.nav-item:hover { border-color: var(--line-2); background: var(--hover); }
.nav-item[aria-selected="true"] { background: var(--ac-fill); color: var(--ac-on); border-color: var(--ac-fill); }
.nav-item[aria-selected="true"] .n { color: inherit; opacity: .85; }
.brand-home { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 4px 6px 4px 2px; border: 0; border-radius: var(--r-md); background: none; color: inherit; font: inherit; cursor: pointer; text-align: left; }
.brand-home:hover:not([disabled]) { background: var(--hover); }
.brand-home[disabled] { cursor: default; }
.brand-home b { font-size: 15px; font-weight: 700; white-space: nowrap; }
.ph-head .brand-home { flex: 0 1 auto; }
.nav-item[disabled] { opacity: .45; cursor: default; }
.nav-item .n { margin-left: auto; font-size: var(--fs-xs); color: var(--tx-3); font-variant-numeric: tabular-nums; }
.side-h { font-size: var(--fs-xs); color: var(--tx-3); font-weight: 600; padding: 16px 10px 6px; }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 2px; display: flex; flex-direction: column; gap: 10px; }
.dstate { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: var(--fs-xs); color: var(--tx-2); line-height: 1.35; }
.dstate b { font-weight: 600; color: var(--tx); font-size: var(--fs-xs); }
.dstate span:last-child { grid-column: 2; color: var(--tx-3); }
.dstate.warn b, .dstate.warn span:last-child { color: var(--warn); }
.dstate.warn .dot { background: var(--warn-dot); box-shadow: none; }
.dstate.ok .dot { background: var(--tx); box-shadow: none; }
.side-off .side .lbl, .side-off .side .n, .side-off .side-h, .side-off .brand-row b, .side-off .dstate > *:not(.dot) { display: none; }
.side-off .nav-item { justify-content: center; padding: 0; }
.side-off .brand-row { flex-direction: column; padding: 0; gap: 10px; }
.side-off .dstate { grid-template-columns: 8px; justify-content: center; }
.main { min-width: 0; display: flex; flex-direction: column; }
.sbar { position: sticky; top: 0; z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); min-height: var(--bar-h); display: flex; align-items: center; gap: 8px 14px; padding: 8px 20px; box-sizing: border-box; flex-wrap: wrap; }
.sbar-title { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.crumb { font-size: var(--fs-xs); color: var(--tx-3); font-weight: 600; }
.sbar-title b { font-size: var(--fs-lg); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.015em; }
.sbar-sub { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--tx-3); margin-top: 3px; }
.save { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; color: var(--tx-2); }
.save.ok .dot { background: var(--tx-2); box-shadow: none; }
.save.warn { color: var(--warn); }
.save.warn .dot { background: var(--warn-dot); box-shadow: none; }
.sbar-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sbar .btn.go { padding: 0 20px; min-height: 42px; }
.m-only { display: none; }
.main-body { padding: var(--s-6) 28px 48px; display: flex; flex-direction: column; gap: var(--s-4); min-width: 0; box-sizing: border-box; }
.main-body.flowing { padding: 0; gap: 0; }
.notice-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.memo-line { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); padding: 10px 20px; font-size: var(--fs-sm); color: var(--tx); box-sizing: border-box; }
.memo-line .ic { color: var(--red-tx); }
.memo-line:hover { background: var(--hover); }
.memo-line span { color: var(--tx-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.memo-line b { white-space: nowrap; }

/* what to check before class, on one quiet line */
.ready { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: 4px 0; align-items: stretch; padding: 8px 20px; border-bottom: 1px solid var(--line); }
.ready::before { content: "시작 전 확인"; font-size: var(--fs-xs); font-weight: 600; color: var(--tx-3); align-self: center; padding-right: 16px; }
.rd { display: flex; gap: 10px; align-items: center; text-align: left; padding: 6px 12px; margin: 0; border: 0; border-left: 1px solid var(--line); border-radius: 0; background: none; font-size: var(--fs-sm); color: var(--tx-2); min-width: 0; line-height: 1.35; }
.rd > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.rd b, .rd-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.rd:hover { background: var(--hover); color: var(--tx); }
.rd b { font-weight: 600; color: var(--tx); }
.rd-sub { color: var(--tx-3); font-size: var(--fs-xs); }
.rd.ok .dot { background: var(--tx-2); box-shadow: none; }
.rd.warn, .rd.warn b { color: var(--warn); }
.rd.warn .dot { background: var(--warn-dot); box-shadow: none; }

/* lesson library ("내 수업"): rows grouped like a list, a side summary of the one picked */
.lib { display: flex; flex-direction: column; gap: var(--s-4); }
.lib-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lib-head h2 { font-size: var(--fs-xl); font-weight: 700; }
.recent { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.recent .label { margin-right: 4px; }
.rchip { min-height: 32px; padding: 0 12px; border-radius: var(--r-pill); border: 0; background: var(--bg-sunk); font-size: var(--fs-sm); color: var(--tx); font-weight: 500; }
.rchip:hover { background: var(--hover); box-shadow: inset 0 0 0 1px var(--line-2); }
.rchip.off { display: inline-flex; align-items: center; color: var(--tx-3); }
.lib-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.lib-main { display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
.lib-tools { display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.filters .label { margin: 0 4px 0 10px; color: var(--tx-3); }
.filters .label:first-child { margin-left: 0; }
.fchip { min-height: 32px; padding: 0 12px; border-radius: var(--r-pill); border: 0; background: none; font-size: var(--fs-sm); color: var(--tx-2); font-weight: 500; }
.fchip:hover { background: var(--hover); color: var(--tx); }
.fchip.on { background: var(--strong); color: var(--strong-on); font-weight: 600; }
.vtabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg-sunk); border-radius: var(--r-md); margin-left: auto; }
.vtabs button { min-height: 30px; padding: 0 10px; border: 0; border-radius: var(--r-sm); background: none; color: var(--tx-2); font-size: var(--fs-sm); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.vtabs button[aria-pressed="true"] { background: var(--surface); color: var(--tx); box-shadow: var(--lift); }
.list-h { font-size: var(--fs-xs); font-weight: 600; color: var(--tx-3); }
.lcards { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.lcard { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto 20px; gap: 18px; align-items: center; text-align: left; padding: 12px 8px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--tx); box-sizing: border-box; width: 100%; }
.lcard:hover { background: var(--hover); }
.lcard.on { background: var(--ac-soft); }
.lc-thumb { display: block; }
.lc-thumb .slide { border-radius: 5px; }
.lc-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lcard b { font-size: var(--fs-base); font-weight: 650; line-height: 1.4; }
.lc-tag { font-size: var(--fs-xs); color: var(--tx-3); font-weight: 500; }
.lc-meta { font-size: var(--fs-sm); color: var(--tx-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lc-meta em { font-style: normal; color: var(--ac); font-weight: 600; }
.lc-go { color: var(--tx-3); }
.lcards.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px 18px; border-top: 0; }
.lcards.gallery .lcard { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 0; border: 0; background: none; align-items: start; }
.lcards.gallery .lcard:hover .slide, .lcards.gallery .lcard.on .slide { box-shadow: 0 0 0 2px var(--ac-fill); }
.lcards.gallery .lc-go { display: none; }
.lcards.gallery .lc-meta { white-space: normal; }
/* my lessons ('내 수업', 2026-11-14): no lesson bar. A head with where things are kept, three ways to begin (one strong button),
   then one row per lesson: the whole row opens it, copy and delete wait in its ⋯ menu */
.mylib { gap: 0; max-width: 1040px; }
/* the title and where things are kept share one line when there is room (the list starts higher on 1366×768 · 1280×590) */
.my-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.my-head h2 { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.01em; line-height: 1.25; margin: 0; }
.my-where { font-size: var(--fs-sm); color: var(--tx-2); display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; }
.link-btn { border: 0; background: none; padding: 0; font: inherit; color: var(--tx); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); cursor: pointer; }
.link-btn:hover { text-decoration-color: currentColor; }
.my-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: var(--s-4); }
.my-ex { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px; color: var(--tx-2); font-weight: 500; font-size: var(--fs-md); }
.my-help { display: flex; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: var(--fs-xs); color: var(--tx-3); }
.my-help > span + span::before, .my-help .up-box > summary::before { content: "·"; margin: 0 6px; color: var(--tx-3); }
.my-help .up-box { border: 0; padding: 0; }
.my-tip { margin: 10px 0 0; font-size: var(--fs-sm); color: var(--tx-2); max-width: 62em; }
.my-tip b { color: var(--tx); font-weight: 600; }
.my-help .up-box > summary { display: inline-flex; min-height: 32px; font-size: var(--fs-xs); color: var(--tx-2); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.my-help .up-box[open] { flex-basis: 100%; }
.my-help .up-box[open] > summary { margin-bottom: 8px; }
.my-help .up-box[open] > summary::before { content: none; }
.mylib.over { outline: 2px dashed var(--ac-fill); outline-offset: 8px; border-radius: var(--r-md); }
.mylib > .note, .mylib > .warn-note, .mylib > .confirm, .mylib > .analysis, .mylib > .progress, .mylib > .small-text { margin-top: var(--s-3); }
.mylib .list-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: var(--s-5); padding-bottom: 6px; font-size: var(--fs-sm); color: var(--tx); font-weight: 600; }
.mylib .list-h .muted { font-size: var(--fs-xs); font-weight: 500; }
.mlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.mrow { position: relative; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); }
.mrow:hover, .mrow.menu-on { background: var(--hover); }
/* the last-class column has one width on every row, so the › line up */
.m-open { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 224px) 18px; align-items: center; gap: 0 16px; min-height: 62px; text-align: left; padding: 9px 4px 9px 8px; border: 0; background: none; color: var(--tx); cursor: pointer; }
.m-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.m-text b { font-size: var(--fs-base); font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.m-sub { display: flex; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--tx-2); line-height: 1.45; }
.m-sub > span + span::before { content: "·"; margin: 0 6px; color: var(--tx-3); }
.m-recent { color: var(--tx); font-weight: 600; }

.ppt-like .prow { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; align-items: center; font-size: var(--fs-md); }
.col-stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.swatch { min-height: 38px; padding: 0 6px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-sm); white-space: nowrap; min-width: 0; color: var(--tx); }
.swatch.on { box-shadow: inset 0 0 0 1.5px var(--tx); font-weight: 700; }
.sw { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
/* the white margin around the code is the quiet zone a phone camera needs */
.qr-box { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 14px; align-items: center; }
.qr { width: 172px; height: 172px; background: #FFFFFF; border-radius: var(--r-lg); padding: 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; box-shadow: var(--lift); }
.qr img, .qr canvas { width: 140px !important; height: 140px !important; }
.qr-hidden { width: 172px; height: 172px; border-radius: var(--r-lg); border: 1.5px dashed var(--line-2); display: flex; align-items: center; justify-content: center; text-align: center; font-size: var(--fs-xs); color: var(--tx-3); padding: 10px; box-sizing: border-box; }
.pin-big { font-size: 36px; font-weight: 700; letter-spacing: .18em; font-variant-numeric: tabular-nums; }

/* records: a list on the left of the page, an open record reads like a document */
#records.panel { border: 0; padding: 0; background: none; gap: var(--s-4); }
.pane-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.step-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step-h h2 { font-size: var(--fs-xl); font-weight: 700; }
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg-sunk); border-radius: var(--r-md); }
.tab { min-height: 30px; padding: 0 12px; border-radius: var(--r-sm); border: 0; background: none; font-size: var(--fs-sm); color: var(--tx-2); white-space: nowrap; font-weight: 600; }
.tab.on { background: var(--surface); color: var(--tx); box-shadow: var(--lift); }
.hist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.rec { border-bottom: 1px solid var(--line); }
.rec-head { width: 100%; text-align: left; background: none; border: 0; padding: 14px 8px; display: grid; grid-template-columns: 150px minmax(0, 1fr) auto 20px; gap: 14px; align-items: center; color: inherit; font-size: var(--fs-md); }
.rec-head:hover { background: var(--hover); }
.rec.open > .rec-head { background: var(--bg-sub); }
.rec-head .chev { color: var(--tx-3); transition: transform .15s; }
.rec.open .rec-head .chev { transform: rotate(180deg); }
.rec-body { padding: 8px 8px 28px; display: flex; flex-direction: column; gap: 24px; max-width: 860px; }
.rec-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.rec-cols ul, .rec-cols ol { margin: 6px 0 0; padding-left: 20px; font-size: var(--fs-md); display: flex; flex-direction: column; gap: 6px; }
.rec-body textarea { min-height: 60px; }
.copy-box { min-height: 140px; font-size: var(--fs-sm); }
.ex-recs { padding-top: 8px; }
.ex-recs > summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; margin-bottom: 10px; flex-wrap: wrap; padding: 8px 0; }
.ex-recs > summary::-webkit-details-marker { display: none; }
.rec.ex .rec-head { color: var(--tx); }
.sec-t { font-size: var(--fs-sm); font-weight: 700; color: var(--tx); margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.sec-t .n { color: var(--tx-3); font-weight: 600; }
/* what to teach again comes first: a red rule, plain sentences */
.again-list { margin: 0; padding: 2px 0 2px 16px; list-style: none; border-left: 3px solid var(--sig-red); display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-base); line-height: 1.55; }
.again-list.none { border-left-color: var(--line-2); color: var(--tx-2); font-size: var(--fs-md); }

/* time band: each scene as wide as the time it took, coloured by the class's light; the grey rule below is the plan */
.tl.band { display: flex; gap: 3px; height: 48px; }
.tl.band .seg { flex: var(--w) 1 0; min-width: 6px; border-radius: var(--r-sm); background: var(--bg-sunk); color: var(--tx-2); display: flex; flex-direction: column; justify-content: center; padding: 0 8px; overflow: hidden; box-sizing: border-box; position: relative; }
.tl.band .seg b { font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl.band .seg small { font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl.band .seg.sig-red { background: var(--red-bg); color: var(--red-tx); box-shadow: inset 0 -3px 0 var(--sig-red); }
.tl.band .seg.sig-yellow { background: var(--yel-bg); color: var(--yel-tx); box-shadow: inset 0 -3px 0 var(--sig-yellow); }
.tl.band .seg.sig-green { background: var(--grn-bg); color: var(--grn-tx); box-shadow: inset 0 -3px 0 var(--sig-green); }
.tl.band .seg.skip { background: repeating-linear-gradient(135deg, var(--bg-sunk) 0 5px, var(--bg) 5px 10px); color: var(--tx-3); }
.tl.band .seg.over::after { content: ""; position: absolute; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn-dot); }
.plan { display: flex; gap: 3px; margin-top: 6px; }
.plan i { flex: var(--w) 1 0; height: 4px; border-radius: 2px; background: var(--line-2); min-width: 6px; }
.band-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--tx-3); margin-top: 8px; }
.band-legend span { display: inline-flex; gap: 6px; align-items: center; }
.band-legend i { width: 8px; height: 8px; border-radius: 50%; }

/* ---------- in class: a dark presenting surface, the key line first ---------- */
/* the record's time band shares .tl: width follows the time taken; a scene's light shows as a coloured edge */
.tl { display: flex; gap: 3px; height: 22px; }
.tl .seg { flex: var(--w) 1 0; min-width: 6px; position: relative; border-radius: 4px; background: var(--bg-sunk); overflow: hidden; font-size: 11.5px; color: var(--tx-2); display: flex; align-items: center; padding: 0 6px; box-sizing: border-box; }
.tl .seg[data-act] { cursor: pointer; }
.tl .seg.sig-red { box-shadow: inset 0 -3px 0 var(--sig-red); }
.tl .seg.sig-yellow { box-shadow: inset 0 -3px 0 var(--sig-yellow); }
.tl .seg.sig-green { box-shadow: inset 0 -3px 0 var(--sig-green); }
/* in class, scene progress: one equal step per scene (the bar drawn by ::before, the step itself the place to click).
   passed = the accent, toned down · this scene = the full accent · to come = quiet. Parts of the lesson (도입 · 전개 · 정리) are groups with a wider gap */
.tl.by-scene { gap: 8px; height: var(--tl-h, 8px); }
.tl.by-scene .ph { display: flex; gap: 3px; flex: var(--n) 1 0; min-width: 0; }
.tl.by-scene .seg { flex: 1 1 0; min-width: 0; padding: 0; background: none; border-radius: 0; box-shadow: none; overflow: visible; }
.tl.by-scene .seg::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: var(--tl-bar, 8px); transform: translateY(-50%); border-radius: 3px; background: var(--bg-sunk); }
.tl.by-scene .seg.done::before { background: var(--ac-fill); opacity: .55; }
@supports (color: color-mix(in srgb, red, blue)) {
  .tl.by-scene .seg.done::before { background: color-mix(in srgb, var(--ac-fill) 55%, var(--bg-sunk)); opacity: 1; }
  .tl.by-scene .seg.seen::before { background: color-mix(in srgb, var(--ac-fill) 22%, var(--bg-sunk)); }
}
.tl.by-scene .seg.now::before { background: var(--ac); }
.tl.by-scene .seg.now.over::before { background: var(--warn-dot); }
.tl.by-scene .seg[data-act]:hover::before { box-shadow: 0 0 0 1px var(--tx-3); }
/* many scenes: one continuous bar, the parts still apart */
.tl.by-scene.flat { gap: 3px; }
.tl.by-scene.flat .ph { gap: 0; }
.tl.by-scene.flat .seg::before { border-radius: 0; }
.tl.by-scene.flat .seg:first-child::before { border-radius: 3px 0 0 3px; }
.tl.by-scene.flat .seg:last-child::before { border-radius: 0 3px 3px 0; }
.tl.by-scene.flat .seg:only-child::before { border-radius: 3px; }
/* the class clock against the plan: thinner and quieter than the steps; warn once past the plan */
.tbar { position: relative; height: 3px; border-radius: 2px; background: var(--line); }
.tbar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--tx-3); }
.tbar > .mk { width: 2px; top: -2px; bottom: -2px; margin-left: -1px; border-radius: 1px; background: var(--tx-2); }
.tbar.over > .js-tfill { background: var(--warn-dot); }
.late { display: inline-flex; gap: 8px; align-items: center; min-height: 28px; padding: 0 12px; border-radius: var(--r-pill); background: var(--warn-bg); color: var(--warn); font-weight: 700; font-size: var(--fs-sm); flex-wrap: wrap; }
.late .btn { min-height: 26px; }

.pv { display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; background: var(--bg); }
.pv-head { display: grid; grid-template-columns: minmax(180px, auto) minmax(120px, 1fr) auto; gap: 16px 24px; align-items: center; padding: 12px 24px; box-sizing: border-box; }
.pv-who { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.pv-who small { font-size: var(--fs-xs); color: var(--tx-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
.pv-who b { font-size: var(--fs-base); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
/* the teacher screen's progress: the scene number first and largest, the class clock small beside it, then an 8px step bar
   (a 22px strip to click: a step jumps to that scene) and the 3px time bar */
.prog { display: flex; flex-direction: column; min-width: 0; }
.prog-top { display: flex; align-items: baseline; gap: 12px; min-width: 0; white-space: nowrap; line-height: 1.05; }
.prog-n { font-size: var(--fs-base); color: var(--tx-2); font-weight: 600; }
.prog-n b { font-size: var(--fs-2xl); color: var(--tx); font-weight: 700; letter-spacing: -.02em; }
.prog-t { margin-left: auto; font-size: var(--fs-sm); color: var(--tx-2); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.prog-t b { font-size: var(--fs-md); color: var(--tx); font-weight: 600; }
.prog-t.over, .prog-t.over b { color: var(--warn); }
.pv-head .tl.by-scene { --tl-h: 22px; }
/* the time bar sits in the lower edge of the steps' click strip, so the head grows only a little */
.pv-head .tbar { margin-top: -5px; }
/* a light on a scene: a small dot above its step (the colours stay with the light buttons) */
.pv-head .tl.by-scene .seg.sig-red::after, .pv-head .tl.by-scene .seg.sig-yellow::after, .pv-head .tl.by-scene .seg.sig-green::after { content: ""; position: absolute; left: 50%; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; }
.pv-head .tl.by-scene .seg.sig-red::after { background: var(--sig-red); }
.pv-head .tl.by-scene .seg.sig-yellow::after { background: var(--sig-yellow); }
.pv-head .tl.by-scene .seg.sig-green::after { background: var(--sig-green); }
.pv-right-h { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.pv-clock { display: flex; gap: 18px; align-items: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pv-clock span { display: flex; flex-direction: column; line-height: 1.15; align-items: flex-end; }
.pv-clock b { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.pv-clock .sc b { font-size: 17px; }
.pv-clock small { font-size: 11.5px; color: var(--tx-3); margin-top: 3px; }
.rh-pill { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: var(--r-pill); background: var(--ac-soft); color: var(--tx); font-size: var(--fs-sm); flex-wrap: wrap; }
.rh-pill .muted { color: var(--tx-2); }
.pv-warn.calm { background: var(--surface); color: var(--tx-2); box-shadow: inset 0 0 0 1px var(--line); }
.pv-warn { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 24px 8px; padding: 10px 14px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--warn); font-size: var(--fs-md); font-weight: 600; }
.pv > .confirm { margin: 0 24px 8px; }
.more { position: relative; }
.more-menu, .tools-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; background: var(--surface); border-radius: var(--r-lg); padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 210px; box-shadow: var(--pop); }
.more-menu .btn { justify-content: flex-start; border-color: transparent; background: none; }
.more-menu .btn:hover { background: var(--hover); }
.tools-pop { min-width: 300px; gap: 10px; padding: 12px; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tools .label { width: 100%; }
.pv-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 4px 24px 16px; min-height: 0; flex: 1; }
.pv-left, .pv-right { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
.prompter { padding: 0; gap: 18px; border: 0; background: none; border-radius: 0; }
.prompter-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--tx-2); }
.prompter-h b { font-size: var(--fs-lg); font-weight: 650; color: var(--tx-2); }
.say-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.say { width: 100%; text-align: left; border: 0; background: transparent; padding: 2px 8px 2px 18px; position: relative; font-size: 21px; line-height: 1.45; font-weight: 700; color: var(--tx); border-radius: var(--r-md); letter-spacing: -.02em; }
.say::before { content: ""; position: absolute; left: 0; top: .3em; bottom: .3em; width: 4px; border-radius: 2px; background: var(--ac-fill); }
.say:hover { background: var(--hover); }
.say.done { color: var(--tx-3); font-weight: 600; }
.say.done::before { background: var(--line-2); }
.say-list.fs-2 .say { font-size: 24px; }
.say-list.fs-3 .say { font-size: 28px; }
.notes { font-size: var(--fs-md); line-height: 1.65; color: var(--tx-2); }
.notes b { color: var(--tx); font-weight: 600; margin-right: 4px; }
.memo-box { background: var(--bg-sub); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-md); box-shadow: inset 3px 0 0 var(--sig-red); }
.memo-box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.pr-foot { display: flex; flex-direction: column; gap: 12px; }
/* the teacher's note in the key lines' place: easy to read at a glance, a little smaller than a key line (it is longer) */
.note-lead { display: flex; flex-direction: column; gap: 6px; }
.note-lead b { font-size: var(--fs-xs); font-weight: 600; color: var(--tx-3); }
.note-lead p { margin: 0; font-size: 19px; line-height: 1.6; font-weight: 500; color: var(--tx); white-space: pre-wrap; overflow-wrap: anywhere; }
.note-lead.fs-2 p { font-size: 22px; }
.note-lead.fs-3 p { font-size: 25px; }
.pv .note-lead p { font-size: clamp(20px, 1.9vw, 30px); }
.pv .note-lead.fs-2 p { font-size: clamp(23px, 2.2vw, 34px); }
.pv .note-lead.fs-3 p { font-size: clamp(26px, 2.6vw, 38px); }
.pv .pr-foot { margin-top: auto; padding-top: 12px; }
.qline { display: flex; gap: 10px; align-items: center; min-width: 0; }
.qline .small-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--tx-2); }
.qform { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 0; }
.qform input { flex: 1; min-height: 38px; }
.pv-screen { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pv-screen .label, .next-line .label { display: flex; gap: 8px; align-items: center; color: var(--tx-2); }
.onair { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 8px; border-radius: var(--r-pill); background: var(--bg-sunk); color: var(--tx); font-size: 11.5px; font-weight: 700; margin-left: auto; }
.onair i { width: 7px; height: 7px; border-radius: 50%; background: var(--tx); }
.onair.mat { background: var(--ac-soft); color: var(--ac); }
.onair.mat i { background: var(--ac-fill); }
.fit > .slide { width: 100%; }
.pv-screen.mat .slide { box-shadow: 0 0 0 3px var(--ac-fill); }
/* the video on the student screen: one line under its preview (play · pause, what it is doing, its time) */
.vid-bar { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 10px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--lift); }
.vid-bar .btn { flex-shrink: 0; min-height: 36px; }
.vid-bar .vb-state { flex: 1; min-width: 0; font-size: var(--fs-sm); color: var(--tx-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vid-bar.warn .vb-state { color: var(--warn); white-space: normal; }
.vid-bar .vb-time { flex-shrink: 0; font-size: var(--fs-sm); color: var(--tx); }
/* after moving away from a playing video: the way back for 5 seconds, over the dock (the layout does not move) */
.undo-move { position: fixed; left: 24px; bottom: 176px; z-index: 40; display: flex; align-items: center; gap: 12px; max-width: min(640px, calc(52vw - 24px)); flex-wrap: wrap; padding: 10px 12px 10px 16px; border-radius: var(--r-lg); background: var(--surface); color: var(--tx); box-shadow: var(--lift), 0 0 0 1px var(--line); font-size: var(--fs-sm); }
.undo-move .btn { flex-shrink: 0; }
.slide.media.vid { box-shadow: 0 0 0 1px rgba(255, 255, 255, .14); }
/* a video that ended or cannot play: its frame is covered (YouTube's end screen suggests other videos) */
.vid-cover { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4cqw; padding: 4cqw; text-align: center; background: #0E1116; color: #FFFFFF; }
.vid-cover b { font-size: 4cqw; line-height: 1.3; }
.vid-cover span { font-size: 2.4cqw; opacity: .8; }
.next-line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--surface); min-width: 0; box-shadow: var(--lift); }
.next-line b { font-size: var(--fs-base); font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nl-say { grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tx-2); font-size: var(--fs-sm); }
/* PR #25: the next scene's slide, small, left of its name. The card is the surface; the text line inside is the same as before */
.next-card { display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--lift); min-width: 0; }
.next-card .next-line { flex: 1; padding: 0; background: none; box-shadow: none; border-radius: 0; }
.nl-pic { flex: 0 0 auto; width: 152px; height: 86px; container-type: size; display: flex; align-items: center; justify-content: center; }
.nl-pic > .slide { width: min(100cqw, calc(100cqh * var(--ar, 1.7778))); border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
.drawer { padding: 14px; gap: 10px; background: var(--surface); border: 0; box-shadow: var(--lift); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.drawer-head .label { font-size: var(--fs-sm); color: var(--tx); font-weight: 700; }
.drawer-hint { font-size: var(--fs-xs); color: var(--tx-2); }
.drawer-hint b { color: var(--sig-ink, var(--k-ink)); }
.items { display: flex; flex-direction: column; gap: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--bg-sub); box-shadow: inset 3px 0 0 var(--k-line); }
.item.up { background: var(--k-bg); }
.item.on-tv { box-shadow: inset 3px 0 0 var(--k-line), inset 0 0 0 2px var(--ac-fill); }
.item-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; grid-column: 1 / -1; }
.item-title { font-size: var(--fs-base); font-weight: 600; line-height: 1.4; }
.item-note { font-size: var(--fs-xs); color: var(--tx-2); grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-act { display: flex; gap: 6px; grid-row: 2 / span 2; grid-column: 2; }
.ai-out { font-size: var(--fs-md); line-height: 1.6; background: var(--bg-sub); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.ai-out q { font-weight: 600; }
/* the dock: back · materials · the light · next, always in the same place */
.pv-bar { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: 148px auto minmax(0, 1fr) minmax(220px, 300px); gap: 10px; align-items: center; padding: 12px 24px 16px; background: var(--bg); border-top: 1px solid var(--line); }
.pv-bar .btn { min-height: 64px; border-radius: var(--r-lg); font-size: var(--fs-lg); }
.pv-bar .nav-prev { background: var(--bg-sunk); border-color: transparent; }
.pv-bar .nav-prev:hover { background: var(--hover); }
.pv-bar .nav-main { justify-content: space-between; padding: 0 20px; text-align: left; }

<script>
(function () {
  "use strict";
  // the address this page is served from (QR for the phone points here)
  const PAGE_URL = location.origin + location.pathname;
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const QRJS = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  const JSZIPJS = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
  const V = 5;

  // ---------- lessons: made-for-this-app examples live in lessons.js, apart from the screen code ----------
  const DATA = window.NAVI_DATA || { pics: {}, lessons: [], records: [] };
  const LESSONS = DATA.lessons;
  const DEFAULT_LESSON = "ex-s4-boiling";

        refD = db.doc("lessons/deck"); refC = db.doc("lessons/settings"); refH = db.doc("lessons/hub");
        refH.onSnapshot((snap) => {
          hub = snap.exists ? snap.data() : null;
          if (confirmed(snap)) { hubSeen = true; ctlEval(); }
          if (isHub()) { takeStart(snap); answerPing(snap); } else { startAnswer(); seePong(); }
          render();
        }, (e) => { if (e && e.code === "permission-denied") { hubOff = true; ownFlush(); followS(); render(); } });
        // closing or reloading the PC says so, so a phone does not offer to start on a PC that is gone
        window.addEventListener("pagehide", () => {
          if (refH && isHub() && holds() && hubKey) { hubKey = ""; refH.update({ on: false, stage: false, at: now() }).catch(() => {}); }
          // the PIN's spot frees up at once (it would end by itself after three minutes anyway)
          if (lobby && lobby.open && db.pair) db.pair.close(lobby);
        });
        // phones by PIN: the list of phones let in and their commands, once this PC holds the class
        let pairListening = false;
        pairListen = () => {
          if (!pairOn()) { if (lobby || lobbyState) closePair(); render(); return; }
          if (!pairListening) {
            pairListening = true;
            db.pair.devices((list) => { devList = list; render(); });
            db.collection("cmds").onSnapshot((q) => { q.docs.forEach((x) => takeCmds(x.id, x.data())); }, () => {});
          }
          if (connOpen || pinShown) ensurePair();
          render();
        };
        if (db.pair && isHub()) pairListen();
        // the display name (profile/me): 'none' only when the server says so, then the first-sign-in line asks for it
        if (db.account && !db.account.device) db.doc("profile/me").onSnapshot((snap) => {
          if (snap.exists) profile = snap.data(); else if (confirmed(snap)) profile = null;
          render();
        }, () => {});
        // my lessons on the account (teachers/{uid}/decks): the teacher PC reads the list; a phone never does
        if (mineAcct()) db.collection("decks").orderBy("at", "desc").limit(200).onSnapshot((q) => {
          MINE = q.docs.map((x) => mineRow(x.id, x.data(), "acct")); sortMine();
          mineSeen = true; mineMsg = "";
          reopenLast(); render();
        }, () => { mineMsg = "내 수업 목록을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요."; render(); });
        if (pinDevice()) { refCmd = db.doc("cmds/" + db.account.uid); refCmd.onSnapshot((snap) => { cmdAck(snap.exists ? snap.data() : null); }, () => {}); }
        refD.onSnapshot((snap) => {
          const d = snap.exists ? snap.data() : null;
          srvDeck = d; srvSeen = true;
          // a phone shows the lesson the teacher PC sent; the PC keeps the lesson it opened (in the artifact runtime the account's copy is the lesson)
          if (d && d.v === V && !localDeck && (!keepsHere() || !isHub())) { D = clone(d); if (!pageById(selScene)) selScene = order()[0]; }
          offerFromAccount();
          render();
        }, () => {});
        refC.onSnapshot((snap) => {
          const d = snap.exists ? snap.data() : null;
          // 'no settings yet' counts only when the server says so, not a copy kept while offline
          if (snap.exists || confirmed(snap)) cSeen = true;
          if (d && d.v >= 2) { const local = C.pin; C = Object.assign(defaultC(), clone(d), { v: V }); if (d.pin) cStored = true; else C.pin = local; }
          // the first time this account is used: the teacher PC keeps its PIN on the account (a phone never makes one)
          if (cSeen && !cStored && isHub()) { cStored = true; commitC({ pin: C.pin || newPin() }); }
          bindSession();
          if (ownQ.length && ctl === "free") wantHub().catch(() => {});
          render();
        }, () => {});
        if (shares("memos")) db.collection("memos").orderBy("at", "desc").limit(200).onSnapshot((q) => { MEMOS = q.docs.map((x) => Object.assign({ id: x.id }, x.data())); render(); }, () => {});
        else watchRecs();
        bindSession();
      }
    } catch (e) { db = null; }
    // signed in but the account could not be opened (Firebase did not load): this device only, and the records still stay apart from other teachers' (shared PC)
    if (!db) { const au = window.naviAuth; if (au && au.uid) ownerTag = au.uid; storeOk = true; loadLocal(); adoptReady(); }
    try { assets = await window.claude.use("assets"); } catch (e) { assets = null; }
    try { sample = await window.claude.use("sample"); render(); } catch (e) { sample = null; }
  })();
})();
</script>
